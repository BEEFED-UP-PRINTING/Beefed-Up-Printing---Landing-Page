kind = "web"
previewPath = "/"
title = "Beefed Up Printing - Landing Page"
version = "1.0.0"
id = "artifacts/beefed-up-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25188

[services.development]
run = "pnpm --filter @workspace/beefed-up-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beefed-up-landing", "run", "build" ]
publicDir = "artifacts/beefed-up-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25188"
BASE_PATH = "/"
